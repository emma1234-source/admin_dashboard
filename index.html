<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class = "wrapper">
        <div class = "sidebar">
            <div class = "logo_area">
                <img src = "./icons/view-dashboard.svg" alt = "dashboard icon">
                <p>Dashboard</p>
            </div>
            
            <ul class = "sidebar_block_1">
                <li class = "sidebar_link">
                    <img src = "./icons/home.svg" alt = "home icon">
                    <p>Home</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/account.svg" alt = "profile icon">
                    <p>Profile</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/message.svg" alt = "message icon">
                    <p>Messages</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/history.svg" alt = "history icon">
                    <p>History</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/file-document-multiple-outline.svg" alt = "file-document-multiple-outline">
                    <p>Tasks</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/crowd.svg" alt = "crowd icon">
                    <p>Communities</p>
                </li>
            </ul>
            <ul class = "sidebar_block_2">
                <li class = "sidebar_link">
                    <img src = "./icons/cog-outline.svg" alt = "cog-outline">
                    <p>Settings</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/chat-question-outline.svg" alt = "chat-question-outline">
                    <p>Support</p>
                </li>
                <li class = "sidebar_link">
                    <img src = "./icons/security.svg" alt = "security">
                    <p>Security</p>
                </li>
            </ul>
            
        </div>
        <div class = "header">
            <div class = "search_container">
                <img src = "./icons/magnify.svg" alt = "search">
                <input type = "search" name = "search">
            </div>
            <div class = "user_name">
                <img src= "./icons/bell-ring-outline.svg" alt = "bell ring" class = "icon">
                <img src = "./avatars/avatar1.svg" alt = "avatar1" class = "avatar">
                <p>"Morgan Oakley</p>
            </div>
            <div class = "hi_there">
                <img src = "./avatars/avatar1.svg" alt = "avatar1">
                <div class = "hi_there_text">
                    <p class = "hi_there_1">Hi there,</p>
                    <p class = "hi_there_2">Morgan Oakley (@morgan)</p>
                </div>
            </div>
            <div class = "header_buttons">
                <button type = "button" class = "new_btn">New</button>
                <button type ="button" class = "upload_btn">Upload</button>
                <button type = "button" class = "share_btn">Share</button>
            </div>
        </div>
        <div class = "content">
           
        </div>
    </div>
</body>
</html>
